name: one-shot-restore-readme
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Feature branch that holds zlib-b64 README parts
        required: true
        default: wrk/a4d-endpoint-overlap-comparison-boundary
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore README from split zlib+b64 staging
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, zlib, pathlib
          a = pathlib.Path("00_WORK/.tmp_readme_b64_a.txt").read_text().strip()
          b = pathlib.Path("00_WORK/.tmp_readme_b64_b.txt").read_text().strip()
          raw = zlib.decompress(base64.b64decode(a + b))
          pathlib.Path("README.md").write_bytes(raw)
          assert b"WORKER: 2 (Total: 5)" in raw
          print("restored", len(raw), "bytes")
          PY
          rm -f 00_WORK/.tmp_readme_b64_a.txt \
                00_WORK/.tmp_readme_b64_b.txt \
                00_WORK/.tmp_readme.zlib.b64 \
                00_WORK/.tmp_readme_part_a.txt \
                00_WORK/.tmp_size_probe_20k.txt \
                .github/workflows/one-shot-restore-readme.yml
          git config user.name "Grigori Vakhrushev"
          git config user.email "g.vakhrushev1993@gmail.com"
          git add -A
          git status
          git commit -m "fix: restore README.md (WORKER 2 / Total 5); drop staging"
          git push origin "HEAD:${{ inputs.target_branch }}"
