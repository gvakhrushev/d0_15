name: D0 Lean build

on:
  push:
    branches: ["main"]
    paths:
      - "03_FORMALIZATION/**"
  pull_request:
    paths:
      - "03_FORMALIZATION/**"
      - ".github/workflows/lean-build.yml"
  workflow_dispatch:

concurrency:
  group: lean-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect D0 formalization changes in triggering commit
        id: d0-formalization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            head="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=2 origin "$head"
            parent="$(git rev-parse "$head^")"
            if git diff --quiet "$parent" "$head" -- 03_FORMALIZATION; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Latest PR head commit does not change D0 formalization; full Lean build is unnecessary."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "$after" -- 03_FORMALIZATION; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Push does not change D0 formalization; full Lean build is unnecessary."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release proof closure
        if: steps.d0-formalization.outputs.changed == 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "03_FORMALIZATION"
          build-args: "D0.All"
          use-mathlib-cache: "true"
          use-github-cache: "true"
          test: "false"
          lint: "false"
