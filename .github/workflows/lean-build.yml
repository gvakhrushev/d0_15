name: D0 Lean build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Lean build scope
        id: lean_scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "needs_lean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "needs_lean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE" "${{ github.sha }}" --               03_FORMALIZATION               .github/workflows/lean-build.yml; then
            echo "needs_lean=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_lean=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No Lean-impacting changes
        if: steps.lean_scope.outputs.needs_lean != 'true'
        run: echo "Skipping D0.All: no Lean/formalization source changed."

      - name: Build release proof closure
        if: steps.lean_scope.outputs.needs_lean == 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "03_FORMALIZATION"
          build-args: "D0.All"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
