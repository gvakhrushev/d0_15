name: D0 Lean build

on:
  push:
    branches: ["main"]
    paths:
      - "03_FORMALIZATION/**"
      - ".github/workflows/lean-build.yml"
  pull_request:
    paths:
      - "03_FORMALIZATION/**"
      - ".github/workflows/lean-build.yml"
  workflow_dispatch:

concurrency:
  group: lean-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release proof closure
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "03_FORMALIZATION"
          build-args: "D0.All"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
