name: D0 Lean build

on:
  push:
    branches: ["main"]
    paths:
      - "03_FORMALIZATION/**"
      - ".github/workflows/lean-build.yml"
  pull_request:
    paths:
      - "03_FORMALIZATION/**"
      - ".github/workflows/lean-build.yml"
  workflow_dispatch:

concurrency:
  group: lean-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checkout is a synthetic merge commit; main pushes are ordinary
          # one-parent commits. Two levels are enough for HEAD^1..HEAD.
          fetch-depth: 2

      - name: Detect D0 formalization changes
        id: d0-formalization
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- 03_FORMALIZATION; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No D0 formalization changes; full Lean build is unnecessary."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release proof closure
        if: steps.d0-formalization.outputs.changed == 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "03_FORMALIZATION"
          build-args: "D0.All"
          use-mathlib-cache: "true"
          # lean-action already restores/saves the whole project .lake cache.
          # Keep this explicit; do not layer a second actions/cache over .lake.
          use-github-cache: "true"
          test: "false"
          lint: "false"
