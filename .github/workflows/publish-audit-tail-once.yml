name: Publish reviewed audit-tail tree once
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/publish-audit-tail-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'gvakhrushev/d0_15' && github.event.pull_request.number == 321 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'control/finish-audit-tails-2026-10-06'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply pinned reviewed patch and regenerate exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = fcc375fc9a0255276329ec6c83c3c95f81e39450
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, re, subprocess
          source = subprocess.check_output(['git','show','fcc375fc9a0255276329ec6c83c3c95f81e39450:.github/workflows/publish-audit-tail-once.yml'], text=True)
          encoded = re.search("encoded = '''(.*?)'''", source, re.S)[1]
          # Transport-only corrections verified against the local patch. The
          # decoded patch SHA256 and the final complete Git tree are immutable.
          edits = [(529,532,'CLZ',''),(868,869,'P',''),(7424,7424,'','o'),(8174,8175,'3','p'),(12559,12559,'','36')]
          for a,b,old,new in reversed(edits):
              assert encoded[a:b] == old
              encoded = encoded[:a] + new + encoded[b:]
          assert len(encoded) == 19368
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '85d053b5e435a17b6907a52904938a4923fe6871de0794b65d8cb06d327bdafa'
          pathlib.Path('/tmp/reviewed-audit.patch').write_bytes(patch)
          PY
          git apply --index /tmp/reviewed-audit.patch
          python tools/generate_lean_views.py
          git add 03_FORMALIZATION/D0/TheoremLedger/ClaimMap.lean
          git rm .github/workflows/publish-audit-tail-once.yml
          test "$(git write-tree)" = b9781a0152fc6b3e7d44442734f244d5a0f9e351
          python tools/test_generate_lean_views.py
          python tools/test_claim_map_coverage.py
          python 03_FORMALIZATION/tools/check_claim_map_coverage.py
          python 03_FORMALIZATION/tools/check_no_sorry_in_core.py --all
          python tools/validate_repo.py
          python tools/validate_work.py
          python tools/validate_agent_protocol.py
          python tools/generate_lean_views.py --check
          git diff --cached --check
      - name: Fast-forward only the authorized branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete reviewed README/status-generator audit tails and queue hygiene'
          git push origin HEAD:refs/heads/control/finish-audit-tails-2026-10-06
