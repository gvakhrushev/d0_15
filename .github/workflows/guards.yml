name: D0 guards

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub-first PR contract
        run: |
          python tools/validate_pr_contract.py --self-test
          python tools/validate_pr_contract.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install certificate dependencies
        run: pip install -r requirements.txt

      - name: Validate canonical architecture
        run: python tools/validate_repo.py

      - name: Formalization debt non-growth
        run: python tools/formalization_debt_audit.py --check

      - name: Claim-strength lint
        run: |
          python tools/lint_claim_strength.py --self-test
          python tools/lint_claim_strength.py

      - name: Claim metadata coverage and hostile controls
        run: |
          python tools/test_claim_map_coverage.py
          python 03_FORMALIZATION/tools/check_claim_map_coverage.py

      - name: No proof shortcuts in core, bridges or support modules
        run: python 03_FORMALIZATION/tools/check_no_sorry_in_core.py --all

      - name: Check generated Lean views
        run: |
          python tools/test_generate_lean_views.py
          python tools/generate_lean_views.py --check

      - name: Active work control
        run: |
          python tools/validate_work.py --self-test
          python tools/validate_work.py

      - name: Agent cold-start and task brief protocol
        run: |
          python tools/validate_agent_protocol.py --self-test
          python tools/validate_agent_protocol.py

      - name: Python syntax
        run: python -m compileall -q tools 04_CERTIFICATES

      - name: Execute changed research certificates
        if: github.event_name != 'workflow_dispatch'
        # Individual scripts retain their own limits below. A broad research PR
        # can contain many independently bounded certificates in this serial step.
        # PR #310 reached the end of 103 passing groups at the 60-minute limit.
        # Keep all script limits and give the serial batch measured headroom.
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "No usable diff base; skipping changed research certificates."
            exit 0
          fi

          mapfile -t CERTS < <(
            git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" -- \
              '02_REGISTRY/research/certificates/*.py'
          )

          if (( ${#CERTS[@]} == 0 )); then
            echo "No changed research certificates."
            exit 0
          fi

          echo "Executing ${#CERTS[@]} changed research certificate(s):"
          printf '  %s\n' "${CERTS[@]}"

          for cert in "${CERTS[@]}"; do
            [[ -f "$cert" ]] || continue

            timeout_seconds=180
            mapfile -t timeout_decl < <(
              sed -n '1,40p' "$cert" \
                | sed -n 's/^# D0_CI_TIMEOUT_SECONDS=\([0-9][0-9]*\)$/\1/p'
            )
            if (( ${#timeout_decl[@]} > 1 )); then
              echo "Multiple D0_CI_TIMEOUT_SECONDS declarations in $cert" >&2
              exit 1
            fi
            if (( ${#timeout_decl[@]} == 1 )); then
              timeout_seconds="${timeout_decl[0]}"
              if (( timeout_seconds < 180 || timeout_seconds > 1800 )); then
                echo "Invalid research-certificate timeout ${timeout_seconds}s in $cert; allowed range is 180..1800." >&2
                exit 1
              fi
            fi

            echo "::group::research certificate: $cert (timeout=${timeout_seconds}s)"
            timeout "${timeout_seconds}s" python "$cert"
            echo "::endgroup::"
          done

      - name: Certificate artifact freshness and semantic mutations
        run: python tools/test_cert_artifact_freshness.py

      - name: Determine expensive certificate scope
        id: cert_scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "needs_certs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "needs_certs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE" "${{ github.sha }}" --               04_CERTIFICATES               01_BOOKS               02_REGISTRY/claims.csv               02_REGISTRY/assumptions.csv               02_REGISTRY/aliases.csv               requirements.txt               tools/run_registered_certs.py               tools/test_cert_artifact_freshness.py; then
            echo "needs_certs=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_certs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Registered certificates
        if: steps.cert_scope.outputs.needs_certs == 'true'
        run: python tools/run_registered_certs.py --workers 6 --timeout 90 --exclude vp_scene_bartholdi_typed.py

      - name: Long-running Bartholdi certificate
        if: steps.cert_scope.outputs.needs_certs == 'true'
        timeout-minutes: 12
        run: python 04_CERTIFICATES/vp_scene_bartholdi_typed.py

      - name: Certificates do not mutate release tree
        if: steps.cert_scope.outputs.needs_certs == 'true'
        run: git diff --exit-code
