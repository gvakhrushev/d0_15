name: D0 guards

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      research_scope:
        description: Research certificates to replay from the checked commit
        type: choice
        options: [full, changed]
        default: full
      base_ref:
        description: Diff base when research_scope is changed
        type: string
        default: origin/main

concurrency:
  group: guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub-first PR contract
        run: |
          python tools/validate_pr_contract.py --self-test
          python tools/validate_pr_contract.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install certificate dependencies
        run: pip install -r requirements.txt

      - name: Validate canonical architecture
        run: python tools/validate_repo.py

      - name: Formalization debt non-growth
        run: python tools/formalization_debt_audit.py --check

      - name: Claim-strength lint
        run: |
          python tools/lint_claim_strength.py --self-test
          python tools/lint_claim_strength.py

      - name: Claim metadata coverage and hostile controls
        run: |
          python tools/test_claim_map_coverage.py
          python 03_FORMALIZATION/tools/check_claim_map_coverage.py

      - name: No proof shortcuts in core, bridges or support modules
        run: python 03_FORMALIZATION/tools/check_no_sorry_in_core.py --all

      - name: Check generated Lean views
        run: |
          python tools/test_generate_lean_views.py
          python tools/generate_lean_views.py --check

      - name: Active work control
        run: |
          python tools/validate_work.py --self-test
          python tools/validate_work.py

      - name: Agent cold-start and task brief protocol
        run: |
          python tools/validate_agent_protocol.py --self-test
          python tools/validate_agent_protocol.py

      - name: Gravity composition contracts and generated overview
        run: |
          python tools/test_gr_assembly.py
          python tools/gr_assembly.py check
          python tools/gr_assembly.py render --check

      - name: Python syntax
        run: python -m compileall -q tools 04_CERTIFICATES

      - name: Fast tooling controls
        run: |
          python tools/test_task_dispatch.py
          python tools/test_run_research_certs.py
          python tools/test_research_input_closure.py
          python tools/test_ci_replay_reuse.py

      - name: Check unchanged scientific inputs against a successful Ready run
        id: replay_reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_replay_reuse.py --event-path "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"

      # Ready replays the cumulative PR diff. A process-doc-only synchronize may
      # reuse a successful Ready run with the same base and environment; every
      # missing or changed input/evidence falls back to normal replay.
      - name: Replay research certificates in isolated worktrees
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && steps.replay_reuse.outputs.reuse != 'true'
        timeout-minutes: 90
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKED_REF: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_SCOPE: ${{ inputs.research_scope || 'full' }}
          MANUAL_BASE: ${{ inputs.base_ref || 'origin/main' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_SCOPE" == "full" ]]; then
            python tools/run_research_certs.py --ref "$CHECKED_REF" --all --workers 2
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BASE="$MANUAL_BASE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BASE"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            python tools/run_research_certs.py --ref "$CHECKED_REF" --all --workers 2
          else
            python tools/run_research_certs.py --ref "$CHECKED_REF" --base "$BASE" --workers 2
          fi

      - name: Preserve research replay logs and mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/research-certificates/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Certificate artifact freshness and semantic mutations
        run: python tools/test_cert_artifact_freshness.py

      - name: Determine expensive certificate scope
        id: cert_scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "needs_certs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ steps.replay_reuse.outputs.reuse }}" == "true" ]]; then
            echo "needs_certs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "needs_certs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "needs_certs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE" "${{ github.sha }}" --               04_CERTIFICATES               01_BOOKS               02_REGISTRY/claims.csv               02_REGISTRY/assumptions.csv               02_REGISTRY/aliases.csv               requirements.txt               tools/run_registered_certs.py               tools/test_cert_artifact_freshness.py; then
            echo "needs_certs=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_certs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Registered certificates
        if: steps.cert_scope.outputs.needs_certs == 'true'
        run: python tools/run_registered_certs.py --workers 6 --timeout 90 --exclude vp_scene_bartholdi_typed.py

      - name: Long-running Bartholdi certificate
        if: steps.cert_scope.outputs.needs_certs == 'true'
        timeout-minutes: 12
        run: python 04_CERTIFICATES/vp_scene_bartholdi_typed.py

      - name: Certificates do not mutate release tree
        if: steps.cert_scope.outputs.needs_certs == 'true'
        run: git diff --exit-code
