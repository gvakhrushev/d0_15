name: Run pinned research synchronization preparation
on:
  push:
    branches: ['exp/a4d-resonance-divisor-stratification']
    paths: ['.github/workflows/run-pinned-research-sync-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'gvakhrushev/d0_15' && github.ref == 'refs/heads/exp/a4d-resonance-divisor-stratification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute exactly the previously published tree preparation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7d8a9f6aa8b78babd75d3b30b61f44ec0725f94e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', '7d8a9f6aa8b78babd75d3b30b61f44ec0725f94e:.github/workflows/prepare-research-sync-once.yml'], text=True)
          code = source.split("          python - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          exec(compile(textwrap.dedent(code), '<pinned-reviewed-sync-preparation>', 'exec'))
          PY
